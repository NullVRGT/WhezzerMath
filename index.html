<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew's Math</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #001f4d;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    .search {
      margin-left: auto;
      margin-right: 20px;
    }
    .search input {
      padding: 5px;
      border-radius: 5px;
      border: none;
    }
    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }
    h2 {
      margin-bottom: 20px;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .game-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-align: center;
    }
    .game-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .game-card h3 {
      margin: 0 0 10px;
    }
    .game-card p {
      color: #555;
    }
    #gameArea {
      display: none;
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    canvas {
      background: #fff;
      border: 2px solid #000;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Matthew's Math</h1>
  <div class="search">
    <input type="text" placeholder="Search...">
  </div>
</header>

<div class="container">
  <h2>Math Games</h2>
  <div class="games">
    <div class="game-card" onclick="startGame('push')">
      <img src="/path-to-your-image/math-push.png" alt="Math Push">
      <h3>Math Push</h3>
      <p>Push the block to solve math puzzles!</p>
    </div>

    <div class="game-card" onclick="startGame('quiz')">
      <img src="/path-to-your-image/quiz-math.png" alt="Quiz Math">
      <h3>Quiz Math</h3>
      <p>Answer quick math questions to win!</p>
    </div>

    <div class="game-card" onclick="startGame('addition')">
      <img src="/path-to-your-image/addition.png" alt="Addition">
      <h3>Addition</h3>
      <p>Add numbers fast before time runs out!</p>
    </div>
  </div>

  <div id="gameArea">
    <button onclick="backToMenu()">Back to Menu</button>
    <div id="gameContent"></div>
  </div>
</div>

<script>
function startGame(game) {
  document.querySelector('.games').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';

  const gameContent = document.getElementById('gameContent');
  gameContent.innerHTML = '';

  if (game === 'push') {
    gameContent.innerHTML = `<canvas id='gameCanvas' width='400' height='400'></canvas>`;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let player = { x: 50, y: 50, size: 30 };

    document.addEventListener('keydown', movePlayer);

    function movePlayer(e) {
      switch (e.key) {
        case 'ArrowUp': player.y -= 10; break;
        case 'ArrowDown': player.y += 10; break;
        case 'ArrowLeft': player.x -= 10; break;
        case 'ArrowRight': player.x += 10; break;
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'blue';
      ctx.fillRect(player.x, player.y, player.size, player.size);

      ctx.fillStyle = 'red';
      ctx.fillRect(200, 200, 30, 30);
    }

    draw();
  }

  if (game === 'quiz') {
    let question, answer;
    function newQuestion() {
      let a = Math.floor(Math.random() * 10);
      let b = Math.floor(Math.random() * 10);
      question = `${a} + ${b}`;
      answer = a + b;
      gameContent.innerHTML = `
        <h2>What is ${question}?</h2>
        <input id='userAnswer' type='number'>
        <button onclick='checkAnswer()'>Submit</button>
      `;
    }
    window.checkAnswer = function() {
      const userAnswer = parseInt(document.getElementById('userAnswer').value);
      if (userAnswer === answer) {
        alert('Correct!');
      } else {
        alert('Wrong! Try again.');
      }
      newQuestion();
    }
    newQuestion();
  }

  if (game === 'addition') {
    let total = 0;
    function newAddition() {
      let num = Math.floor(Math.random() * 10) + 1;
      total += num;
      gameContent.innerHTML = `
        <h2>Total: ${total}</h2>
        <button onclick='newAddition()'>Add ${num}</button>
      `;
    }
    window.newAddition = newAddition;
    newAddition();
  }
}

function backToMenu() {
  document.querySelector('.games').style.display = 'grid';
  document.getElementById('gameArea').style.display = 'none';
}
</script>

</body>
</html>
